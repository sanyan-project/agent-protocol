[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanyan-agent-protocol"
version = "1.0.0a1"
description = "Deterministic hard gates for executor-reviewer agent workflows"
readme = "README_EN.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ThreeYan contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
sanyan-audit = "sanyan_protocol.cli:main"

[tool.setuptools]
packages = ["sanyan_protocol"]
