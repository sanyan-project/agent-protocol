name: Synthetic bug report
description: Report a reproducible protocol defect without private audit data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Do not include real chats, credentials, customer data, or private paths.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
    validations:
      required: true
